:root{

  color-scheme:light;

*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:var(--pix);font-size:16px;line-height:1.8;color:var(--ink);
  background:var(--white) repeating-conic-gradient(var(--black) 0 25%,var(--white) 0 50%) 0 0/160px 160px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
main{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:22px;background:var(--white);border:4px solid var(--black);box-shadow:8px 8px 0 var(--black);padding:28px 22px}
.pc,.icon{image-rendering:pixelated;image-rendering:crisp-edges}
.pc{display:block;width:100%;height:auto}
h1,h2,.type-name{font-family:var(--pix);font-weight:400;margin:0;line-height:1.4;text-wrap:balance}
h1{font-size:2rem;text-align:center}
.eyebrow{font-size:.8rem;letter-spacing:.2em;text-align:center}
.lead{margin:0}
.icon{display:block;width:min(56%,230px);height:auto;margin:0 auto}
.pieces{display:flex;justify-content:center;gap:6px}.pieces .pc{width:44px}
.voice{border:2px dashed var(--black);padding:8px 12px;margin:0}
.voice small{display:block;color:var(--grey);font-size:.8rem}
button{font:inherit;cursor:pointer}
.primary{display:inline-block;background:var(--black);color:var(--white);border:3px solid var(--black);border-radius:0;padding:12px 22px;font-size:1.05rem;text-decoration:none;box-shadow:4px 4px 0 var(--grey)}
.primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--grey)}
.center{text-align:center}
button:focus-visible,a:focus-visible{outline:3px dashed var(--black);outline-offset:3px}
.ghost{background:var(--white);color:var(--black);border:3px solid var(--black);border-radius:0;padding:8px 12px;box-shadow:3px 3px 0 var(--black)}
.ghost:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black)}
.progress{display:flex;gap:4px}
.progress span{flex:1;height:12px;border:2px solid var(--black);background:var(--white)}
.progress span.on{background:var(--black)}
.qno{font-size:.9rem;font-variant-numeric:tabular-nums}
.q{font-size:1.3rem;min-height:3.8em}

.card-body h3{margin:0 0 4px;font-size:.85rem;font-weight:400;display:inline-block;background:var(--black);color:var(--white);padding:0 6px}
.card-body p{margin:0}
.facts{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.facts li::before{content:"■ "}
.axes{display:flex;flex-direction:column;gap:12px}
.axis-top{display:flex;justify-content:space-between;gap:6px;font-size:.78rem}
.axis-top b{font-weight:400;font-variant-numeric:tabular-nums;text-align:center}
.track{position:relative;height:14px;border:2px solid var(--black);background:var(--white)}
.fill{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--black) 0 6px,var(--white) 6px 8px)}
.mark{position:absolute;top:-6px;width:8px;height:22px;margin-left:-4px;background:var(--white);border:2px solid var(--black)}
.legend{font-size:.78rem;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;border:2px solid var(--black);vertical-align:middle;margin-right:4px}
.pair{display:flex;gap:12px;align-items:center;border-top:3px dotted var(--black);padding-top:14px}
.pair .g{display:flex;gap:2px;flex:none}.pair .g .pc{width:40px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:.8rem;color:#444;margin:0}
.tag{font-size:.8rem;text-align:right}
.sec{border-top:3px dotted var(--black);padding-top:14px}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:280px;aspect-ratio:1;border:3px solid var(--black);margin:8px 0}
.board div{display:flex;align-items:center;justify-content:center}
.board .l{background:var(--white)}.board .d{background:var(--grey)}
.board div .pc{width:82%}
.board .dot::after{content:"";width:30%;height:30%;background:var(--black)}
.board .x::after{content:"×";color:var(--black);font-size:1.2rem;line-height:1}
.opening{border:3px solid var(--black);padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 4px 0 var(--black)}
.opening .nm{font-size:1.15rem}
.opening code{font-family:var(--pix);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.primary:active,.ghost:active{transform:none}}
</style>

 P:{sq:[4,1],move:"前に1マス(最初の1回だけ2マスも可)進みます。駒を取るときだけ斜め前。後ろには戻れません。一番奥まで進むと、キング以外の好きな駒に「成る」ことができます(プロモーション)。価値は1点です。",
  op:{nm:"フレンチ・ディフェンス",mv:"1.e4 e6 2.d4 d5",tx:"ポーンが斜めにつながる「ポーンの鎖」で陣地を固めてから反撃する作戦。ポーンが主役のオープニングです。"}}
};
const FILES="abcdefgh";
function board(key){
 const [f,r]=EX[key].sq, dot=new Set(), cap=new Set(), id=(x,y)=>x+","+y, inb=(x,y)=>x>=0&&x<8&&y>=0&&y<8;
 const slide=dirs=>dirs.forEach(([dx,dy])=>{let x=f+dx,y=r+dy;while(inb(x,y)){dot.add(id(x,y));x+=dx;y+=dy;}});
 const step=dirs=>dirs.forEach(([dx,dy])=>{if(inb(f+dx,r+dy))dot.add(id(f+dx,r+dy));});
 const O=[[1,0],[-1,0],[0,1],[0,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]];
 if(key==="R")slide(O); if(key==="B")slide(D); if(key==="Q")slide([...O,...D]); if(key==="K")step([...O,...D]);
 if(key==="N")step([[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]);
 if(key==="P"){dot.add(id(f,r+1));dot.add(id(f,r+2));cap.add(id(f-1,r+1));cap.add(id(f+1,r+1));}
 let h="";
 for(let y=7;y>=0;y--)for(let x=0;x<8;x++){const c=(x+y)%2?"l":"d";const k=id(x,y);
  h+=`<div class="${c} ${dot.has(k)?"dot":""} ${cap.has(k)?"x":""}" aria-hidden="true">${x===f&&y===r?P[key].g:""}</div>`;}
 return `<div class="board" role="img" aria-label="${P[key].name}の動ける範囲">${h}</div>`;
}
const LBL=["まったく違う","やや違う","どちらでもない","ややそう","とてもそう"];

const app=document.getElementById("app");
let i=0,ans=[];

function start(){
 app.innerHTML=`<img class="icon" src="${ICON}" alt="ポーン小生のアイコン">
 <div class="eyebrow">CHESS PIECE TYPE</div>
 <h1>あなたは、盤上のどの駒?</h1>
 <div class="center"><button class="primary" id="go">▶ 診断をはじめる</button></div>
 <div class="pieces" aria-hidden="true">${ORDER.map(k=>IMG[k]).join("")}</div>
 <p class="lead">10の質問に5段階で答えると、6つのチェス駒からあなたのタイプがわかります。駒の性格は、2026年の大会の棋譜82,329局を集計して決めました。所要時間は1分ほどです。</p>
 <p class="voice">チェスのルールを知らなくても大丈夫です。直感でお答えください。<small>案内役: ポーン小生</small></p>
 `;
 document.getElementById("go").onclick=()=>{i=0;ans=[];track("quiz_start");ask();};
}
function ask(){
 const q=Q[i];
 app.innerHTML=`<div class="progress" aria-hidden="true">${Q.map((_,k)=>`<span class="${k<=i?"on":""}"></span>`).join("")}</div>
 <div class="qno">Q${i+1} / ${Q.length}</div>
 <h2 class="q">${q.t}</h2>
 <div class="scale" role="group" aria-label="5段階で回答">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${ans[i]===n?"sel":""}" aria-label="${["まったく違う","やや違う","どちらでもない","ややそう","とてもそう"][n-1]}"></button>`).join("")}</div>
 <div class="ends"><span>まったく違う</span><span>とてもそう</span></div>
 ${i>0?`<div><button class="ghost" id="back">ひとつ戻る</button></div>`:""}`;
 app.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.n;b.classList.add("sel");setTimeout(()=>{i++;i<Q.length?ask():mbti();},160);});
 const bk=document.getElementById("back"); if(bk) bk.onclick=()=>{i--;ask();};
}
/* 採点: 回答を1〜5点(逆向きの質問は6−回答)にし、傾向ごとに2問の平均を0〜100%にする。
   駒の%は棋譜の数字を「6駒で一番低い駒=0%、一番高い駒=100%」に並べ直したもの。
   あなたと各駒の%を、それぞれ50%からのズレ(プラス/マイナス)に直し、その向きがどれだけ似ているか(コサイン類似度)で比べる。
   似ている度合いが一番高い駒が結果。どの駒もほぼ同じ割合で出るよう、小さな補正(bias)を足している。 */
function score(){
 const sum=[0,0,0,0,0],n=[0,0,0,0,0];
 Q.forEach((q,k)=>{const a=ans[k];sum[q.a]+=q.r?6-a:a;n[q.a]++;});
 const u=sum.map((s,k)=>(s/n[k]-1)/4*100);
 const uc=u.map(x=>x-50),nu=Math.hypot(...uc)||1e-9;
 const sim=p=>{const pc=P[p].v.map(x=>x-50);return uc.reduce((s,x,k)=>s+x*pc[k],0)/nu/Math.hypot(...pc);};
 const ranked=[...ORDER].sort((a,b)=>(sim(b)+P[b].bias)-(sim(a)+P[a].bias));
 const fit=p=>Math.round((sim(p)+1)/2*100);
 return {u,ranked,fit};
}
const MBTI=["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];
let myMbti="";
function mbti(){
 app.innerHTML=`<div class="qno">任意の質問</div>
 <h2 class="q">あなたのMBTI(16タイプ)を知っていたら教えてください。</h2>
 <p class="note">駒とMBTIの関係を調べるためのアンケートです。診断結果には影響しません。回答は名前などを含まない形で集計にのみ使います。</p>
 <div class="actions">${MBTI.map(m=>`<button class="ghost" data-m="${m}">${m}</button>`).join("")}</div>
 <div><button class="primary" id="skip">わからない・答えない</button></div>`;
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{myMbti=b.dataset.m;result();});
 document.getElementById("skip").onclick=()=>{myMbti="";result();};
}
function result(){
 const {u,ranked,fit}=score();const key=ranked[0],t=P[key],pr=P[t.pair],second=P[ranked[1]];
 track("quiz_complete",{piece:key,mbti:myMbti||"none"});
 saveAnswer({piece:t.name,second:second.name,fit:fit(key),mbti:myMbti,answers:ans.slice(0,10),axes:u.map(x=>Math.round(x))});
 const pct=x=>Math.round(x);
 const text=`私は「${t.name}」タイプでした。${t.catch}。相性がいいのは${pr.name}。 #チェス駒診断`;
 app.innerHTML=`<div class="eyebrow">診断結果</div>
 <section class="card" aria-label="診断結果カード">
  <div class="card-head"><div class="glyph" aria-hidden="true">${t.g}</div>
   <div><div class="match">あなたは</div><div class="type-name">${t.name}タイプ</div><p class="catch">${t.catch}</p><div class="match">一致度 ${fit(key)}%</div></div></div>
  <div class="card-body">
   <p>${t.desc}</p>
   <div><h3>データで見る${t.name}</h3><ul class="facts">${t.facts.map(f=>`<li>${f}</li>`).join("")}</ul></div>
   <div><h3>13年でどう変わったか</h3><p>${t.change}</p></div>
   <div><h3>強み</h3><p>${t.str}</p></div>
   <div><h3>弱点</h3><p>${t.weak}</p></div>
   <div><h3>本気になる時期</h3><p>${t.phase}。${t.name}の動きが一番多い局面です。</p></div>
   <div><h3>あなたの5つの傾向</h3>
    <div class="axes">${AX.map((a,k)=>`<div><div class="axis-top"><span>${a.lo}</span><b>${a.name} ${pct(u[k])}%</b><span>${a.hi}</span></div>
     <div class="track"><div class="fill" style="width:${pct(u[k])}%"></div><div class="mark" style="left:${t.v[k]}%" title="${t.name}の値"></div></div></div>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--black)"></i>あなた</span><span><i style="background:var(--white)"></i>${t.name}</span></div>
   </div>
   <div class="pair"><div class="g" aria-hidden="true">${t.g}${pr.g}</div><div><h3>相性のいい駒: ${pr.name}</h3><p>${t.pairWhy}</p><p class="note">この組み合わせは「${t.set}」のキーホルダーになっています。</p></div></div>
   <p class="note">次に近いのは${second.name}タイプ(一致度 ${fit(ranked[1])}%)でした。</p>
   <div class="sec"><h3>${t.name}の動き方</h3><p>${EX[key].move}</p>${board(key)}<p class="note">${key==="P"?"●は進めるマス、×は駒を取れるマス(白のポーンの場合)。":"●が動けるマス(まわりに駒がない場合)。"}</p></div>
   <div class="sec"><h3>${t.name}タイプにおすすめのオープニング</h3>
    <div class="opening"><span class="nm">${EX[key].op.nm}</span><code>${EX[key].op.mv}</code><span>${EX[key].op.tx}</span></div>
    <p class="note">オープニングは対局の最初の数手の決まった指し方のこと。「1.e4」は1手目に白がeの列のポーンを4段目へ進める、という意味です。</p></div>
   <p class="voice">${t.name}の貴殿も、小生と同じく一手ずつ。本日も一歩一ポーン。<small>ポーン小生</small></p>
   <div class="tag">#チェス駒診断</div>
  </div>
 </section>
 <p class="note">このカードをスクリーンショットして、ストーリーズやXでシェアできます。</p>
 <div class="actions">
  <a class="primary" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SITE)}" target="_blank" rel="noopener" id="sx">Xでシェア</a>
  <button class="ghost" id="copy">結果の文章をコピー</button>
  <button class="ghost" id="again">もう一度診断する</button>
 </div>
 <p class="note">データについて: The Week in Chess(2026年3〜10月、82,329局/2013年9〜12月、17,968局)の大会棋譜を集計。2つの時期の差には、収録された大会の種類の違いも含まれます。駒の画像: Chessnut pieces by Alexis Luengas(Apache License 2.0)。回答内容(10問の回答・結果・任意のMBTI)は、個人を特定しない形で集計に使います。</p>`;
 document.getElementById("again").onclick=start;
 document.getElementById("sx").onclick=()=>track("share_x");
 const c=document.getElementById("copy");
 c.onclick=()=>{navigator.clipboard.writeText(text+" "+SITE).then(()=>c.textContent="コピーしました").catch(()=>{c.textContent=text;});};
 window.scrollTo(0,0);
}
start();
</script>
