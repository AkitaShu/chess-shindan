<title>チェス駒タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一列。盤面の市松模様の帯、質問は1問ずつ5段階、結果は縦長カード */
:root{
  --bg:#ece6d6; --surface:#f8f4ea; --fg:#22281f; --muted:#5d6457;
  --board-dark:#4e6b52; --board-light:#dfe6cf; --accent:#a8742a; --line:#cfc6ae; --on-dark:#f4efe2;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161c17; --surface:#1f2820; --fg:#ebe6d8; --muted:#a9ae9f;
  --board-dark:#3d5e45; --board-light:#2a3a2d; --accent:#d4a052; --line:#3a4639; --on-dark:#f4efe2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161c17; --surface:#1f2820; --fg:#ebe6d8; --muted:#a9ae9f;
  --board-dark:#3d5e45; --board-light:#2a3a2d; --accent:#d4a052; --line:#3a4639; --on-dark:#f4efe2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.strip{height:28px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  background:repeating-conic-gradient(var(--board-dark) 0 25%,var(--board-light) 0 50%) 0 0/28px 28px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-top:32px}
h1,h2,.type-name{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:2.1rem;font-weight:800}
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--accent);font-weight:700}
.lead{color:var(--muted);margin:0}
.pieces{font-size:2.4rem;letter-spacing:.15em;line-height:1}
.voice{border-left:3px solid var(--board-dark);padding:4px 0 4px 14px;margin:0;color:var(--fg)}
.voice small{display:block;color:var(--muted);font-size:.8rem}
button{font:inherit;cursor:pointer}
.primary{display:inline-block;background:var(--board-dark);color:var(--on-dark);border:0;border-radius:6px;padding:14px 20px;font-weight:700;font-size:1rem;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.progress{display:flex;gap:4px}
.progress span{flex:1;height:6px;background:var(--line);border-radius:1px}
.progress span.on{background:var(--board-dark)}
.qno{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:1.35rem;font-weight:600;min-height:3.8em}
.scale{display:flex;justify-content:space-between;align-items:center;gap:6px}
.scale button{flex:none;border-radius:50%;border:2px solid var(--board-dark);background:transparent;transition:transform .12s,background .12s}
.scale button:nth-child(1),.scale button:nth-child(5){width:54px;height:54px}
.scale button:nth-child(2),.scale button:nth-child(4){width:44px;height:44px}
.scale button:nth-child(3){width:34px;height:34px;border-color:var(--muted)}
.scale button:hover{background:var(--board-light);transform:scale(1.06)}
.scale button.sel{background:var(--board-dark)}
.ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:-8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-head{background:var(--board-dark);color:var(--on-dark);padding:22px 20px;display:flex;gap:16px;align-items:center}
.glyph{font-size:4.6rem;line-height:1;flex:none}
.type-name{font-size:1.8rem;font-weight:800}
.catch{margin:0;opacity:.92}
.match{font-size:.85rem;opacity:.85;font-variant-numeric:tabular-nums}
.card-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.card-body h3{margin:0 0 4px;font-size:.8rem;letter-spacing:.12em;color:var(--accent)}
.card-body p{margin:0}
.facts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px}
.axes{display:flex;flex-direction:column;gap:12px}
.axis-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.axis-top b{color:var(--fg);font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;background:var(--line);border-radius:5px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--board-dark);border-radius:5px}
.mark{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;background:var(--accent);border-radius:2px}
.legend{font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px}
.pair{display:flex;gap:12px;align-items:center;border-top:1px dashed var(--line);padding-top:14px}
.pair .g{font-size:2rem;line-height:1;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:.8rem;color:var(--muted);margin:0}
.tag{font-size:.8rem;color:var(--muted);text-align:right}
.pc{display:block;width:100%;height:auto}
.glyph{width:84px;flex:none}.pieces{display:flex;gap:8px}.pieces .pc{width:48px}
.pair .g{display:flex;gap:2px}.pair .g .pc{width:38px}
.board div .pc{width:82%}
.sec{border-top:1px dashed var(--line);padding-top:14px}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:280px;aspect-ratio:1;border:1px solid var(--line);margin:8px 0}
.board div{display:flex;align-items:center;justify-content:center;font-size:1.3rem;line-height:1}
.board .l{background:var(--board-light)}.board .d{background:var(--board-dark);color:var(--on-dark)}
.board .dot::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--accent)}
.board .x::after{content:"×";color:var(--accent);font-weight:700}
.opening{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.opening .nm{font-family:var(--display);font-weight:800;font-size:1.15rem}
.opening code{font-family:ui-monospace,Menlo,monospace;font-size:.9rem;color:var(--accent)}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:700}
.bd{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
.bd th,.bd td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.bd td.n{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.tbl{overflow-x:auto}
.why{margin:6px 0 0;padding-left:1.2em;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){.scale button{transition:none}.scale button:hover{transform:none}}
</style>
</head>

const ORDER=["K","Q","R","B","N","P"];
const EX={

 Q:{sq:[3,3],move:"縦・横・斜めに何マスでも動けます。ルークとビショップの動きを合わせた最強の駒で、価値はポーン9個分(9点)です。",
  op:{nm:"スカンジナビアン・ディフェンス",mv:"1.e4 d5 2.exd5 Qxd5",tx:"2手目でいきなりクイーンが中央に出ていく、珍しい作戦。クイーンが最初から主役になります。"}},
 R:{sq:[3,3],move:"縦と横に何マスでも動けます。価値は5点。序盤は隅に閉じこめられていますが、縦の列が開くと一気に働きます。",
  op:{nm:"クイーンズ・ギャンビット",mv:"1.d4 d5 2.c4",tx:"ポーンを差し出して中央を取りにいく、世界チャンピオン戦でも定番の作戦。縦の列が開きやすく、あとからルークが活躍する展開になりやすいです。"}},
 B:{sq:[3,3],move:"斜めに何マスでも動けます。最初にいたマスの色(白か黒)から一生出られません。価値は3点です。",
  op:{nm:"キングズ・インディアン・ディフェンス",mv:"1.d4 Nf6 2.c4 g6 3.Nc3 Bg7",tx:"ビショップを盤の角近く(g7)に置き、端から端までの長い斜めをにらませる作戦。一歩引いた場所から盤全体に効かせます。"}},
 N:{sq:[3,3],move:"「縦2マス+横1マス」のL字に跳びます。ほかの駒を跳び越えられる唯一の駒です。価値は3点です。",
  op:{nm:"アリョーヒン・ディフェンス",mv:"1.e4 Nf6",tx:"1手目からナイトが飛び出し、相手のポーンをわざと前へ誘い出す挑発的な作戦です。"}},
 P:{sq:[4,1],move:"前に1マス(最初の1回だけ2マスも可)進みます。駒を取るときだけ斜め前。後ろには戻れません。一番奥まで進むと、キング以外の好きな駒に「成る」ことができます(プロモーション)。価値は1点です。",
  op:{nm:"フレンチ・ディフェンス",mv:"1.e4 e6 2.d4 d5",tx:"ポーンが斜めにつながる「ポーンの鎖」で陣地を固めてから反撃する作戦。ポーンが主役のオープニングです。"}}
};
const FILES="abcdefgh";
function board(key){
 const [f,r]=EX[key].sq, dot=new Set(), cap=new Set(), id=(x,y)=>x+","+y, inb=(x,y)=>x>=0&&x<8&&y>=0&&y<8;
 const slide=dirs=>dirs.forEach(([dx,dy])=>{let x=f+dx,y=r+dy;while(inb(x,y)){dot.add(id(x,y));x+=dx;y+=dy;}});
 const step=dirs=>dirs.forEach(([dx,dy])=>{if(inb(f+dx,r+dy))dot.add(id(f+dx,r+dy));});
 const O=[[1,0],[-1,0],[0,1],[0,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]];
 if(key==="R")slide(O); if(key==="B")slide(D); if(key==="Q")slide([...O,...D]); if(key==="K")step([...O,...D]);
 if(key==="N")step([[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]);
 if(key==="P"){dot.add(id(f,r+1));dot.add(id(f,r+2));cap.add(id(f-1,r+1));cap.add(id(f+1,r+1));}
 let h="";
 for(let y=7;y>=0;y--)for(let x=0;x<8;x++){const c=(x+y)%2?"l":"d";const k=id(x,y);
  h+=`<div class="${c} ${dot.has(k)?"dot":""} ${cap.has(k)?"x":""}" aria-hidden="true">${x===f&&y===r?P[key].g:""}</div>`;}
 return `<div class="board" role="img" aria-label="${P[key].name}の動ける範囲">${h}</div>`;
}
const LBL=["まったく違う","やや違う","どちらでもない","ややそう","とてもそう"];

const app=document.getElementById("app");
let i=0,ans=[];

function start(){
 app.innerHTML=`<div class="eyebrow">CHESS PIECE TYPE</div>

 <p class="lead">10の質問に5段階で答えると、6つのチェス駒からあなたのタイプがわかります。駒の性格は、2026年の大会の棋譜82,329局を集計して決めました。所要時間は1分ほどです。</p>
 <p class="voice">チェスのルールを知らなくても大丈夫です。直感でお答えください。<small>案内役: ポーン小生</small></p>

function ask(){
 const q=Q[i];
 app.innerHTML=`<div class="progress" aria-hidden="true">${Q.map((_,k)=>`<span class="${k<=i?"on":""}"></span>`).join("")}</div>

 <h2 class="q">${q.t}</h2>
 <div class="scale" role="group" aria-label="5段階で回答">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${ans[i]===n?"sel":""}" aria-label="${["まったく違う","やや違う","どちらでもない","ややそう","とてもそう"][n-1]}"></button>`).join("")}</div>
 <div class="ends"><span>まったく違う</span><span>とてもそう</span></div>
 ${i>0?`<div><button class="ghost" id="back">ひとつ戻る</button></div>`:""}`;
 app.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.n;b.classList.add("sel");setTimeout(()=>{i++;i<Q.length?ask():mbti();},160);});
 const bk=document.getElementById("back"); if(bk) bk.onclick=()=>{i--;ask();};

/* 採点: 回答を1〜5点(逆向きの質問は6−回答)にし、傾向ごとに2問の平均を0〜100%にする。
   駒の%は棋譜の数字を「6駒で一番低い駒=0%、一番高い駒=100%」に並べ直したもの。
   あなたと各駒の%を、それぞれ50%からのズレ(プラス/マイナス)に直し、その向きがどれだけ似ているか(コサイン類似度)で比べる。
   似ている度合いが一番高い駒が結果。どの駒もほぼ同じ割合で出るよう、小さな補正(bias)を足している。 */
function score(){
 const sum=[0,0,0,0,0],n=[0,0,0,0,0];
 Q.forEach((q,k)=>{const a=ans[k];sum[q.a]+=q.r?6-a:a;n[q.a]++;});
 const u=sum.map((s,k)=>(s/n[k]-1)/4*100);
 const uc=u.map(x=>x-50),nu=Math.hypot(...uc)||1e-9;
 const sim=p=>{const pc=P[p].v.map(x=>x-50);return uc.reduce((s,x,k)=>s+x*pc[k],0)/nu/Math.hypot(...pc);};
 const ranked=[...ORDER].sort((a,b)=>(sim(b)+P[b].bias)-(sim(a)+P[a].bias));
 const fit=p=>Math.round((sim(p)+1)/2*100);
 return {u,ranked,fit};
}
const MBTI=["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];
let myMbti="";

 <div class="actions">${MBTI.map(m=>`<button class="ghost" data-m="${m}">${m}</button>`).join("")}</div>

 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{myMbti=b.dataset.m;result();});
 document.getElementById("skip").onclick=()=>{myMbti="";result();};
}

 <section class="card" aria-label="診断結果カード">

   <div><div class="match">あなたは</div><div class="type-name">${t.name}タイプ</div><p class="catch">${t.catch}</p><div class="match">一致度 ${fit(key)}%</div></div></div>

    <div class="axes">${AX.map((a,k)=>`<div><div class="axis-top"><span>${a.lo}</span><b>${a.name} ${pct(u[k])}%</b><span>${a.hi}</span></div>
     <div class="track"><div class="fill" style="width:${pct(u[k])}%"></div><div class="mark" style="left:${t.v[k]}%" title="${t.name}の値"></div></div></div>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--board-dark)"></i>あなた</span><span><i style="background:var(--accent)"></i>${t.name}</span></div>
   </div>
   <div class="pair"><div class="g" aria-hidden="true">${t.g}${pr.g}</div><div><h3>相性のいい駒: ${pr.name}</h3><p>${t.pairWhy}</p><p class="note">この組み合わせは「${t.set}」のキーホルダーになっています。</p></div></div>
   <p class="note">次に近いのは${second.name}タイプ(一致度 ${fit(ranked[1])}%)でした。</p>
   <div class="sec"><h3>${t.name}の動き方</h3><p>${EX[key].move}</p>${board(key)}<p class="note">${key==="P"?"●は進めるマス、×は駒を取れるマス(白のポーンの場合)。":"●が動けるマス(まわりに駒がない場合)。"}</p></div>
   <div class="sec"><h3>${t.name}タイプにおすすめのオープニング</h3>
    <div class="opening"><span class="nm">${EX[key].op.nm}</span><code>${EX[key].op.mv}</code><span>${EX[key].op.tx}</span></div>
    <p class="note">オープニングは対局の最初の数手の決まった指し方のこと。「1.e4」は1手目に白がeの列のポーンを4段目へ進める、という意味です。</p></div>
   <p class="voice">${t.name}の貴殿も、小生と同じく一手ずつ。本日も一歩一ポーン。<small>ポーン小生</small></p>
   <div class="tag">#チェス駒診断</div>
  </div>
 </section>
 <p class="note">このカードをスクリーンショットして、ストーリーズやXでシェアできます。</p>
 <div class="actions">
  <a class="primary" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SITE)}" target="_blank" rel="noopener" id="sx">Xでシェア</a>

 <p class="note">データについて: The Week in Chess(2026年3〜10月、82,329局/2013年9〜12月、17,968局)の大会棋譜を集計。2つの時期の差には、収録された大会の種類の違いも含まれます。駒の画像: Chessnut pieces by Alexis Luengas(Apache License 2.0)。</p>`;
